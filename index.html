<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Performance Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>

<body>

<div class="container">

  <h1>🏃 Performance Dashboard</h1>

  <div class="cards">

    <div class="card">
      <h3>최근 7일 거리</h3>
      <h2 id="weekDistance">- km</h2>
    </div>

    <div class="card">
      <h3>최근 7일 운동시간</h3>
      <h2 id="weekTime">- 분</h2>
    </div>

  </div>

  <div class="chart-box">
      <h2>거리</h2>
      <div id="distanceChart"></div>
  </div>

  <div class="chart-box">
      <h2>페이스</h2>
      <div id="paceChart"></div>
  </div>

  <div class="chart-box">
      <h2>평균심박</h2>
      <div id="hrChart"></div>
  </div>

  <div class="chart-box">
      <h2>케이던스</h2>
      <div id="cadenceChart"></div>
  </div>

  <div class="chart-box">
      <h2>운동시간</h2>
      <div id="timeChart"></div>
  </div>

  <div class="chart-box">
      <h2>PRE</h2>
      <div id="preChart"></div>
  </div>

</div>

<script src="script.js"></script>

</body>
</html>
